name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testler (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
    env:
      # PyQt6 başsız (headless) çalışsın: Xvcb / sanal ekran gerekmez
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Qt sistem kütüphaneleri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0 libxcb-cursor0 libxcb-icccm4

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Sözdizimi kontrolü (tüm modüller derleniyor mu)
        run: python -m compileall -q app main.py tests

      - name: Birim / regresyon testleri
        run: python -m pytest tests/ -v --tb=short

      - name: Smoke test (hesap + DB + koordinat + UI)
        run: python tests/smoke_test.py

      - name: Görsel kontrol (tema + 6 sayfa render)
        run: python tests/visual_check.py

  build:
    name: Tek exe derleme (Windows)
    runs-on: windows-latest
    needs: test
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: PyInstaller ile derle
        run: python -m PyInstaller ProSU.spec --noconfirm --clean

      - name: Exe üretildi mi?
        run: |
          if (-not (Test-Path dist\ProSU.exe)) { throw "dist\ProSU.exe olusmadi" }
          $f = Get-Item dist\ProSU.exe
          Write-Output ("ProSU.exe boyutu: {0:N1} MB" -f ($f.Length / 1MB))

      - name: Exe'yi artefakt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ProSU-windows-exe
          path: dist/ProSU.exe
          retention-days: 7
          if-no-files-found: error
